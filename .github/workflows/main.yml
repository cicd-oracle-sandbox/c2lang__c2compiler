name: CI

on:
  push:
    branches: [ master, dev, ci_testing, bb_next, header ]
  pull_request:
    branches: [ master ]

jobs:

  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        llvm_version: [16]

    steps:
      - name: clone repo
        uses: actions/checkout@v6

      - name: bootstrap + compile
        run: |
          . env.sh
          make all

      - name: run unit-tests
        run: |
          . env.sh
          make test

  macos:
    name: macOS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    steps:
      - name: clone repo
        uses: actions/checkout@v6
      - name: bootstrap + compile + tests
        run: |
          . env.sh
          make all test

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - name: clone repo
        uses: actions/checkout@v6
      - name: bootstrap + compile + tests
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg_add gmake
          run: |
            . ./env.sh
            gmake all test MAKE=gmake

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: clone repo
        uses: actions/checkout@v6
      - name: bootstrap + compile + tests
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake
          run: |
            . env.sh
            gmake all test MAKE=gmake
